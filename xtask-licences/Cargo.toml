[package]
name = "xtask-licences"
description = "The licence check of `cargo xtask licences`: reads the allow list of deny.toml and the cargo metadata, and judges each third-party crate's SPDX expression. Split from xtask, which was over the crate ceiling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[lints]
workspace = true

[dependencies]
toml = "1"
serde_json = "1"
