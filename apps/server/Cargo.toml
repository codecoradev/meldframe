[package]
name = "meldframe-server"
description = "Server composition root: HTTP, MCP, REST and WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[features]
# Each feature module is compiled in only when its cargo feature is on; leaving one out removes its
# tools from the registry (ADR-0007). The example module is the first.
default = ["example", "mcp", "capture", "assets", "design-review", "export", "variables-import", "variant", "activity"]
example = ["dep:example"]
# The MCP surface: its tools in the registry and the read path behind them (E1.5).
mcp = ["meldframe-http/mcp"]
# The capture tool, its live-socket hook and its upload route (E1.7); it is an MCP tool, so it needs `mcp`.
capture = ["mcp", "dep:capture", "dep:meldframe-http-capture"]
# The asset routes and the upload_asset tool (E2.5, ADR-0015): images kept on local disk under MELDFRAME_ASSETS_DIR; it
# is an MCP tool, so it needs `mcp`.
assets = ["mcp", "dep:assets", "dep:meldframe-http-assets"]
# The design_review tool (E5.4): a numbered critique list per file, in memory or in Postgres with the files; it is an
# MCP tool, so it needs `mcp`.
design-review = ["mcp", "dep:design-review", "dep:meldframe-http-review"]
# The export_frame tool (E4.1, ADR-0019): a frame as HTML with CSS or Tailwind; it is an MCP tool, so it needs `mcp`.
export = ["mcp", "dep:export", "dep:meldframe-http-export"]
# The import_tokens tool (E3.4, ADR-0020): CSS and Tailwind @theme text to variables, one atomic call; it is an MCP tool,
# so it needs `mcp`.
variables-import = ["mcp", "dep:variables-import", "dep:meldframe-http-variables-import"]

# The make_variant tool (E5.4): a copy of a frame beside it, one atomic call; it is an MCP tool, so it needs `mcp`.
variant = ["mcp", "dep:meldframe-http-variant"]

# Batch headers and the note of apply_commands (E5.1, ADR-0021): numbered batches kept beside the log, in memory or in
# Postgres. Without it a call with a note is refused as invalid; it is an MCP argument, so it needs `mcp`.
activity = ["mcp", "dep:activity-store", "dep:meldframe-http-activity"]

[dependencies]
meldframe-http = { path = "../../crates/integrations/meldframe-http" }
meldframe-http-live = { path = "../../crates/integrations/meldframe-http-live" }
meldframe-http-snapshot = { path = "../../crates/integrations/meldframe-http-snapshot" }
meldframe-batch = { path = "../../crates/core/meldframe-batch" }
meldframe-approvals = { path = "../../crates/core/meldframe-approvals" }
meldframe-calls = { path = "../../crates/core/meldframe-calls" }
meldframe-host = { path = "../../crates/core/meldframe-host" }
meldframe-module = { path = "../../crates/core/meldframe-module" }
meldframe-rooms = { path = "../../crates/core/meldframe-rooms" }
example = { path = "../../crates/features/example/example", optional = true }
capture = { path = "../../crates/features/capture/capture", optional = true }
meldframe-http-capture = { path = "../../crates/integrations/meldframe-http-capture", optional = true }
assets = { path = "../../crates/features/assets/assets", optional = true }
meldframe-http-assets = { path = "../../crates/integrations/meldframe-http-assets", optional = true }
design-review = { path = "../../crates/features/design-review/design-review", optional = true }
meldframe-http-review = { path = "../../crates/integrations/meldframe-http-review", optional = true }
export = { path = "../../crates/features/export/export", optional = true }
meldframe-http-export = { path = "../../crates/integrations/meldframe-http-export", optional = true }
variables-import = { path = "../../crates/features/variables-import/variables-import", optional = true }
meldframe-http-variables-import = { path = "../../crates/integrations/meldframe-http-variables-import", optional = true }
meldframe-http-variant = { path = "../../crates/integrations/meldframe-http-variant", optional = true }
activity-store = { path = "../../crates/features/activity/activity-store", optional = true }
meldframe-http-activity = { path = "../../crates/integrations/meldframe-http-activity", optional = true }
meldframe-protocol = { path = "../../crates/core/meldframe-protocol" }
meldframe-stream = { path = "../../crates/core/meldframe-stream" }
serde_json = "1"
meldframe-store-pg = { path = "../../crates/integrations/meldframe-store-pg" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

[lints]
workspace = true
