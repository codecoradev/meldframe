[package]
name = "meldframe-server"
description = "Server composition root: HTTP, MCP, REST and WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[features]
# Each feature module is compiled in only when its cargo feature is on; leaving one out removes its
# tools from the registry (ADR-0007). The example module is the first.
default = ["example", "mcp", "capture", "assets", "design-review", "export", "variables-import", "html-import", "variant", "activity", "checkpoints"]
example = ["dep:example"]
# The MCP surface: its tools in the registry and the read path behind them (E1.5).
mcp = ["meldframe-http/mcp"]
# The capture tool, its live-socket hook and its upload route (E1.7); it is an MCP tool, so it needs `mcp`.
capture = ["mcp", "dep:capture", "dep:meldframe-http-capture", "dep:meldframe-app-export-model"]
# The asset routes and the upload_asset tool (E2.5, ADR-0015): images kept on local disk under MELDFRAME_ASSETS_DIR; it
# is an MCP tool, so it needs `mcp`.
assets = ["mcp", "dep:assets", "dep:meldframe-http-assets"]
# The design_review tool (E5.4): a numbered critique list per file, in memory or in Postgres with the files; it is an
# MCP tool, so it needs `mcp`.
design-review = ["mcp", "dep:design-review", "dep:meldframe-http-review"]
# The export_frame tool (E4.1, ADR-0019): a frame as HTML with CSS or Tailwind; it is an MCP tool, so it needs `mcp`.
export = ["mcp", "dep:export", "dep:meldframe-http-export"]
# The import_tokens tool (E3.4, ADR-0020): CSS and Tailwind @theme text to variables, one atomic call; it is an MCP tool,
# so it needs `mcp`.
variables-import = ["mcp", "dep:variables-import", "dep:meldframe-http-variables-import"]
# The import_html tool (E4.4, ADR-0024): HTML and CSS text to nodes, one atomic call of at most 100 commands; it is an MCP
# tool, so it needs `mcp`.
html-import = ["mcp", "dep:html-import", "dep:meldframe-http-html-import"]

# The make_variant tool (E5.4): a copy of a frame beside it, one atomic call; it is an MCP tool, so it needs `mcp`.
variant = ["mcp", "dep:meldframe-http-variant"]

# Batch headers and the note of apply_commands (E5.1, ADR-0021): numbered batches kept beside the log, in memory or in
# Postgres. Without it a call with a note is refused as invalid; it is an MCP argument, so it needs `mcp`.
activity = ["mcp", "dep:activity-store", "dep:meldframe-http-activity"]

# Checkpoints kept by the server (E5.3, ADR-0023): a run start taken when an agent's write starts a run, in memory or in
# Postgres with the files, the list and create routes and the live frame. Left out, there is no run sink, no route and
# no registry entry. The sink reads through the MCP reader, so it needs `mcp`, and the people who may make a checkpoint
# are the reviewers of the activity module, so it needs `activity`.
checkpoints = ["mcp", "activity", "dep:checkpoint-store", "dep:meldframe-http-checkpoints"]

[dependencies]
meldframe-http = { path = "../../crates/integrations/meldframe-http" }
meldframe-http-live = { path = "../../crates/integrations/meldframe-http-live" }
meldframe-http-snapshot = { path = "../../crates/integrations/meldframe-http-snapshot" }
meldframe-batch = { path = "../../crates/core/meldframe-batch" }
meldframe-approvals = { path = "../../crates/core/meldframe-approvals" }
meldframe-calls = { path = "../../crates/core/meldframe-calls" }
meldframe-host = { path = "../../crates/core/meldframe-host" }
meldframe-module = { path = "../../crates/core/meldframe-module" }
meldframe-rooms = { path = "../../crates/core/meldframe-rooms" }
example = { path = "../../crates/features/example/example", optional = true }
capture = { path = "../../crates/features/capture/capture", optional = true }
meldframe-http-capture = { path = "../../crates/integrations/meldframe-http-capture", optional = true }
meldframe-app-export-model = { path = "../../crates/core/meldframe-app-export-model", optional = true }
assets = { path = "../../crates/features/assets/assets", optional = true }
meldframe-http-assets = { path = "../../crates/integrations/meldframe-http-assets", optional = true }
design-review = { path = "../../crates/features/design-review/design-review", optional = true }
meldframe-http-review = { path = "../../crates/integrations/meldframe-http-review", optional = true }
export = { path = "../../crates/features/export/export", optional = true }
meldframe-http-export = { path = "../../crates/integrations/meldframe-http-export", optional = true }
variables-import = { path = "../../crates/features/variables-import/variables-import", optional = true }
meldframe-http-variables-import = { path = "../../crates/integrations/meldframe-http-variables-import", optional = true }
html-import = { path = "../../crates/features/html-import/html-import", optional = true }
meldframe-http-html-import = { path = "../../crates/integrations/meldframe-http-html-import", optional = true }
meldframe-http-variant = { path = "../../crates/integrations/meldframe-http-variant", optional = true }
activity-store = { path = "../../crates/features/activity/activity-store", optional = true }
meldframe-http-activity = { path = "../../crates/integrations/meldframe-http-activity", optional = true }
checkpoint-store = { path = "../../crates/features/activity/checkpoint-store", optional = true }
meldframe-http-checkpoints = { path = "../../crates/integrations/meldframe-http-checkpoints", optional = true }
meldframe-protocol = { path = "../../crates/core/meldframe-protocol" }
meldframe-stream = { path = "../../crates/core/meldframe-stream" }
meldframe-text = { path = "../../crates/core/meldframe-text" }
serde_json = { version = "1", features = ["float_roundtrip"] }
meldframe-store-pg = { path = "../../crates/integrations/meldframe-store-pg" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

# What the tests in `tests/` use beyond the dependencies above: the `json` and `ws` features of axum, the `io-util`,
# `macros` and `time` of tokio, `tower` (`oneshot`), `http-body-util`, `meldframe-check` and the WebSocket client of the
# live and HTTP tests, `sqlx` (the Postgres tests check the schema directly), the shared store contract, and what the MCP
# tests use: the `rmcp` client over HTTP, `reqwest`, the activity rules and the render coverage table.
# Dev-dependencies do not ship and do not count for the layering (decision 44).
[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
http-body-util = "0.1"
meldframe-check = { path = "../../crates/core/meldframe-check" }
meldframe-store-contract = { path = "../../crates/core/meldframe-store-contract" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
meldframe-activity = { path = "../../crates/core/meldframe-activity" }
meldframe-render = { path = "../../crates/core/meldframe-render" }
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# A test that needs a cargo feature is not built without it, so `cargo test -p meldframe-server --no-default-features`
# still proves that a feature left out removes its tools.
[[test]]
name = "server_limits"
required-features = ["mcp"]

[[test]]
name = "routes"
required-features = ["assets"]

[[test]]
name = "list"
required-features = ["assets"]

[[test]]
name = "absolute"
required-features = ["mcp"]

[[test]]
name = "catalogue"
required-features = ["mcp", "capture", "assets", "design-review", "export", "variables-import", "html-import", "variant", "activity"]

[[test]]
name = "demo"
required-features = ["mcp"]

[[test]]
name = "gate"
required-features = ["mcp"]

[[test]]
name = "gradient"
required-features = ["mcp"]

[[test]]
name = "hardening"
required-features = ["mcp"]

[[test]]
name = "layer_names"
required-features = ["mcp"]

[[test]]
name = "layout_findings"
required-features = ["mcp"]

[[test]]
name = "margin"
required-features = ["mcp"]

[[test]]
name = "padding"
required-features = ["mcp"]

[[test]]
name = "paint"
required-features = ["mcp"]

[[test]]
name = "read_log"
required-features = ["mcp"]

[[test]]
name = "skill"
required-features = ["mcp"]

[[test]]
name = "surface"
required-features = ["mcp"]

[[test]]
name = "text_rules"
required-features = ["mcp"]

[[test]]
name = "variables"
required-features = ["mcp"]

[[test]]
name = "rename"
required-features = ["mcp"]

[[test]]
name = "import_html_arguments"
required-features = ["mcp", "html-import", "export", "activity"]

[[test]]
name = "import_html_limits"
required-features = ["mcp", "html-import", "export", "activity"]

[[test]]
name = "import_html_roundtrip"
required-features = ["mcp", "html-import", "export", "activity"]

[[test]]
name = "import_html_tool"
required-features = ["mcp", "html-import", "export", "activity"]

[[test]]
name = "upload_asset"
required-features = ["assets"]

[[test]]
name = "export_frame"
required-features = ["export"]

[[test]]
name = "import"
required-features = ["variables-import"]

[[test]]
name = "import_more"
required-features = ["variables-import"]

[lints]
workspace = true
