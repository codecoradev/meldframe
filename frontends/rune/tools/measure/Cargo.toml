[package]
name = "meldframe-measure"
description = "The measurements of the Rune desktop spike (E8.2.3): one subcommand for each criterion C1 to C10 of docs/spikes/rune-desktop-spike.md, printing `name value unit` lines and a verdict, and never a number it did not measure."
version.workspace = true
edition.workspace = true
publish.workspace = true

# A bin: it links the Rune toolkit (L3) and the app layer, so it is a front end for the checks of the toolkit swap, as the
# desktop shell is.
[package.metadata.meldframe]
kind = "bin"

[[bin]]
name = "meldframe-measure"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
meldframe-rune-pin = { path = "../../crates/rune-pin" }
meldframe-app = { path = "../../../../crates/app/meldframe-app" }
meldframe-protocol = { path = "../../../../crates/core/meldframe-protocol" }
serde_json = "1"
