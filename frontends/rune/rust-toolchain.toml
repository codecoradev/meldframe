# The toolchain Rune pins at the revision this workspace uses (its `rust-toolchain.toml`). The main
# workspace stays on its own (the repository root), so a `cargo` run inside `frontends/rune/` picks
# this one and a run at the root does not.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
