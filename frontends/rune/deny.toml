# Licence, source and ban policy of the Rune workspace (E8.0.4, ADR-0027, decision 45). `cargo deny check`
# reads it from this directory, and `cargo xtask licences --check` judges the crates this lock reaches
# against the allow list below (the main `deny.toml` at the repository root is not changed: it keeps
# `unknown-git = "deny"` and its shorter list).
#
# The one git source of the repository is Rune, by revision. A bump of the revision changes it here,
# in `Cargo.toml` (nine lines) and in `meldframe_rune_pin::RUNE_REVISION`; the tests of
# `crates/rune-pin` fail when they disagree.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[licenses]
# The main workspace's permissive list, plus what Rune's graph reaches. Add an entry only after the
# owner agrees. MPL-2.0 is weak copyleft (per file): it comes with spellbook (spell check, always on
# for the web target) and with symphonia and opuscule (Ogg and WebM audio, a default feature of
# Rune). The others are permissive: BSD-2-Clause (arrayref), BSL-1.0 (clipboard-win, error-code),
# ISC (libloading).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/anomalyco/rune?rev=048528dc35f0a7499887f334330fd9704cdd8e51"]
