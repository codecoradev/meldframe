# Configuration of `cargo xtask mm-check` (the modular monolith rule, D1 of
# `docs/standards/modular-thin-ui.md`; the rules and their limits are in `xtask/src/monolith.rs`).
#
# Every allow-list entry has a reason and only goes down: an entry that no longer matches fails the
# check as not needed, and `cargo xtask mm-check --base <ref>` rejects an entry that is not on the
# base branch. Do not add entries to make a check pass; share the code instead.
# Against the base, an entry may shrink (a group of copies that loses a member) and may follow a
# move (same function name in `allow_copy`, same file name in `allow_shared`); it may not grow.
# One entry of `allow_copy` covers one group of copies: two groups that have the same members need
# two entries.

[monolith]
# A crate above this many lines (the measure of `size-check`, tests included) that has a
# `src/lib.rs` is a monolith, and MM1, MM2 and MM5 apply to it. No crate is above 4,000 today, so
# the three rules find nothing yet; they bite with the first merge of crates (#315). At 2,500, the
# top of the ideal band, they would already apply to meldframe-app-model (8 modules without a
# one-sentence doc, and a cycle between 8 of its modules).
threshold = 4000

# MM4: a pattern that belongs in one home. `ban` holds Rust source; it is compared token by token,
# so spacing does not matter, and comments, strings and test code are not read. The digits of a hex
# literal and of a `\u{..}` escape are compared without regard to case (`0x200b` is `0x200B`), and
# an `_` stands for any one identifier (`_.len()` reads `hex.len()` and `s.len()`).

[shared.hidden_text]
home = "crates/core/meldframe-text"
use = "use meldframe_text (is_hidden_text, first_hidden, plain, sanitize)"
ban = [
    # The ranges and single characters of the set (U+200B to 200F, 2028 to 202E, 2060 to 206F, the
    # soft hyphen, the variation selectors, the byte order mark, the tag characters), written as
    # a number or as a character.
    "0x200B..=0x200F",
    "'\\u{200B}'..='\\u{200F}'",
    "0x2028..=0x202E",
    "'\\u{2028}'..='\\u{202E}'",
    "0x202A..=0x202E",
    "'\\u{202A}'..='\\u{202E}'",
    "0x2060..=0x206F",
    "'\\u{2060}'..='\\u{206F}'",
    "0xFE00..=0xFE0F",
    "'\\u{FE00}'..='\\u{FE0F}'",
    "0xE0000..=0xE007F",
    "'\\u{E0000}'..='\\u{E007F}'",
    "0xFEFF",
    "'\\u{FEFF}'",
    "0xAD",
    "0x00AD",
    "'\\u{AD}'",
    "'\\u{00AD}'",
    # The controls (category Cc) as ranges: `meldframe_text::is_control_char`.
    "'\\0'..='\\x1f'",
    "'\\x7f'..='\\u{9f}'",
    "'\\u{7f}'..='\\u{9f}'",
    "0x7F..=0x9F",
    "0x007F..=0x009F",
    # A check that is only `is_control`, however it is spelled (`any(char::is_control)`,
    # `any(|c| c.is_control() || ..)`).
    "char::is_control",
    "_.is_control()",
]

[shared.hex_colour]
home = "crates/core/meldframe-css/src/color.rs"
use = "use meldframe_css::color::is_hex"
ban = [
    "matches!(_.len(), 3 | 4 | 6 | 8)",
    "[3, 4, 6, 8].contains(&_.len())",
    "matches!(_.len(), 8 | 6 | 4 | 3)",
]

[shared.asset_id]
home = "crates/core/meldframe-protocol/src/ids.rs"
use = "use meldframe_protocol::{is_asset_id, is_lower_hex} (audit D3)"
ban = [
    "b'0'..=b'9' | b'a'..=b'f'",
    "b'a'..=b'f' | b'0'..=b'9'",
    "'0'..='9' | 'a'..='f'",
    "'a'..='f' | '0'..='9'",
]

[shared.valid_id]
home = "crates/core/meldframe-protocol/src/ids.rs"
use = "use meldframe_protocol::valid_id (audit D4); map false to your own error"
ban = [
    # The four marks in any order inside `matches!`, as `char` and as `u8` (24 orderings each; the first is the one the
    # three old copies had).
    "matches!(_, '_' | '-' | ':' | '.')",
    "matches!(_, '_' | '-' | '.' | ':')",
    "matches!(_, '_' | ':' | '-' | '.')",
    "matches!(_, '_' | ':' | '.' | '-')",
    "matches!(_, '_' | '.' | '-' | ':')",
    "matches!(_, '_' | '.' | ':' | '-')",
    "matches!(_, '-' | '_' | ':' | '.')",
    "matches!(_, '-' | '_' | '.' | ':')",
    "matches!(_, '-' | ':' | '_' | '.')",
    "matches!(_, '-' | ':' | '.' | '_')",
    "matches!(_, '-' | '.' | '_' | ':')",
    "matches!(_, '-' | '.' | ':' | '_')",
    "matches!(_, ':' | '_' | '-' | '.')",
    "matches!(_, ':' | '_' | '.' | '-')",
    "matches!(_, ':' | '-' | '_' | '.')",
    "matches!(_, ':' | '-' | '.' | '_')",
    "matches!(_, ':' | '.' | '_' | '-')",
    "matches!(_, ':' | '.' | '-' | '_')",
    "matches!(_, '.' | '_' | '-' | ':')",
    "matches!(_, '.' | '_' | ':' | '-')",
    "matches!(_, '.' | '-' | '_' | ':')",
    "matches!(_, '.' | '-' | ':' | '_')",
    "matches!(_, '.' | ':' | '_' | '-')",
    "matches!(_, '.' | ':' | '-' | '_')",
    "matches!(_, b'_' | b'-' | b':' | b'.')",
    "matches!(_, b'_' | b'-' | b'.' | b':')",
    "matches!(_, b'_' | b':' | b'-' | b'.')",
    "matches!(_, b'_' | b':' | b'.' | b'-')",
    "matches!(_, b'_' | b'.' | b'-' | b':')",
    "matches!(_, b'_' | b'.' | b':' | b'-')",
    "matches!(_, b'-' | b'_' | b':' | b'.')",
    "matches!(_, b'-' | b'_' | b'.' | b':')",
    "matches!(_, b'-' | b':' | b'_' | b'.')",
    "matches!(_, b'-' | b':' | b'.' | b'_')",
    "matches!(_, b'-' | b'.' | b'_' | b':')",
    "matches!(_, b'-' | b'.' | b':' | b'_')",
    "matches!(_, b':' | b'_' | b'-' | b'.')",
    "matches!(_, b':' | b'_' | b'.' | b'-')",
    "matches!(_, b':' | b'-' | b'_' | b'.')",
    "matches!(_, b':' | b'-' | b'.' | b'_')",
    "matches!(_, b':' | b'.' | b'_' | b'-')",
    "matches!(_, b':' | b'.' | b'-' | b'_')",
    "matches!(_, b'.' | b'_' | b'-' | b':')",
    "matches!(_, b'.' | b'_' | b':' | b'-')",
    "matches!(_, b'.' | b'-' | b'_' | b':')",
    "matches!(_, b'.' | b'-' | b':' | b'_')",
    "matches!(_, b'.' | b':' | b'_' | b'-')",
    "matches!(_, b'.' | b':' | b'-' | b'_')",
    # The same set as an array or as a chain of comparisons (the order the old copies would have used).
    "['_', '-', ':', '.'].contains(&_)",
    "[b'_', b'-', b':', b'.'].contains(&_)",
    "_ == '_' || _ == '-' || _ == ':' || _ == '.'",
    "_ == b'_' || _ == b'-' || _ == b':' || _ == b'.'",
]

[shared.css_number]
home = "crates/core/meldframe-css"
use = "read the number with meldframe-css (one reader; D5 of docs/audits/2026-11-25-rust-modular-monolith.md)"
ban = ["b'.' | b'-' | b'+'", "b'.' | b'+' | b'-'"]

