# Cora Code Review configuration (cora-cli, https://github.com/codecoradev/cora-cli).
# The CI workflow .github/workflows/cora-review.yml reads this file from the base branch; it also configures the local Cora agent review.
# That job holds secrets: never enable `static_analysis.auto_clippy` or a `system_prompt_file` here, because they
# run or read code from the pull request.

focus:
  - security
  - bugs
  - performance

rules:
  - "Layering is enforced by `cargo xtask deps-check`; flag a feature crate that imports another feature crate unless it is composite, and a UI toolkit used outside ui and bin crates."
  - "Every change to a document must pass the single admission gate; flag a new path that writes document data without it."

ignore:
  files:
    - "*.lock"
    - "*.png"
    - "*.svg"
  rules:
    # The removed-symbol rule matches a deleted definition by name against the symbol index of the whole
    # repository, across languages, so a deleted test helper named like a Rust function reads as a breaking
    # change (the known case: a TypeScript test helper named `node` against Rust callers). The scope below is
    # the file that held the removed definition. Removing a helper from a test file breaks no production
    # caller; a test that still calls it fails its own build anyway.
    - rule: index-breaking-change
      files:
        - "**/tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
      reason: "A removed test helper breaks no production caller, and a test that still used it fails its own build; the rule matches by name across languages."

hook:
  mode: block
  min_severity: major
