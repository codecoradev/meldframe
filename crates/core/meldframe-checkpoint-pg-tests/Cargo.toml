[package]
name = "meldframe-checkpoint-pg-tests"
description = "The tests of the checkpoint stack that need a database or the server (E5.3, ADR-0023): the store in Postgres, and the server parts that follow. No library code; split from meldframe-checkpoint-tests so the rules and the memory store do not depend on the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
checkpoint-store = { path = "../../features/activity/checkpoint-store", features = ["contract"] }
meldframe-checkpoints = { path = "../meldframe-checkpoints" }
meldframe-host = { path = "../meldframe-host" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-http = { path = "../../integrations/meldframe-http", features = ["mcp"] }
meldframe-http-checkpoints = { path = "../../integrations/meldframe-http-checkpoints" }
meldframe-module = { path = "../meldframe-module" }
meldframe-http-live = { path = "../../integrations/meldframe-http-live" }
meldframe-server = { path = "../../../apps/server" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.26"

[lints]
workspace = true
