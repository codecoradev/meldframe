[package]
name = "meldframe-app-harness"
description = "The shell of the app tests: plays the platform for several app instances against one real in-memory server. Split from meldframe-app-tests so that two test crates share it. Test support only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-server = { path = "../../../apps/server" }
serde_json = "1"

[lints]
workspace = true
