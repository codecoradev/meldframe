[package]
name = "meldframe-import-html-map-tests"
description = "The tests of the HTML import mapping (E4.4): structure, layout, sizing and text to Commands, and the report. Split from the other tests crates so that each stays under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
html-import = { path = "../../features/html-import/html-import" }
meldframe-check = { path = "../meldframe-check" }
meldframe-layout = { path = "../meldframe-layout" }
meldframe-protocol = { path = "../meldframe-protocol" }
export = { path = "../../features/export/export" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file imports it as `test` on
# wasm32 only. Keep the version in step with `meldframe-import-html-tests`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
