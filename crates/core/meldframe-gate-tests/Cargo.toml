[package]
name = "meldframe-gate-tests"
description = "The tests of the admission gate: policy, quotas, the stable refusal codes and their docs table. Split from meldframe-host so that it stays under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-check = { path = "../meldframe-check" }
meldframe-history = { path = "../meldframe-history" }
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-revert = { path = "../meldframe-revert" }
meldframe-rooms = { path = "../meldframe-rooms" }
meldframe-server = { path = "../../../apps/server" }
serde_json = "1"

[lints]
workspace = true
