[package]
name = "meldframe-variables-rename-tests"
description = "The rename commands of the variable model (renameCollection, renameMode, renameVariable): checks, exact inverse, footprint, per-actor undo, replica and room convergence, revert. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-batch = { path = "../meldframe-batch" }
meldframe-check = { path = "../meldframe-check" }
meldframe-core = { path = "../meldframe-core" }
meldframe-history = { path = "../meldframe-history" }
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-revert = { path = "../meldframe-revert" }
meldframe-rooms = { path = "../meldframe-rooms" }
meldframe-sync = { path = "../meldframe-sync" }
meldframe-variables = { path = "../meldframe-variables" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
