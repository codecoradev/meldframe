[package]
name = "meldframe-app-inspector-tests"
description = "The tests of the inspector fields of meldframe-app (D5, D6): fill types and gradients, border and shadows, layout, padding, margin and sizing, against a loopback server. Split from meldframe-app-unit-tests for the size ceiling; it includes that crate's test harness by path. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde_json = "1"

[lints]
workspace = true
