[package]
name = "meldframe-app-rules"
description = "Rules of the app layer that hold a little state of their own and are given what they need: the connection timing and backoff, the retries of a refused op, the review record with its checkpoints and the plans of a revert and a restore, the mode picks, and the level of an action. Split from meldframe-app for the size ceiling; no AppState, no events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-check = { path = "../meldframe-check" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-revert = { path = "../meldframe-revert" }
meldframe-sync = { path = "../meldframe-sync" }
meldframe-variables = { path = "../meldframe-variables" }

[lints]
workspace = true
