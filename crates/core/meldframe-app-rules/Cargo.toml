[package]
name = "meldframe-app-rules"
description = "Rules of the app layer that hold a little state of their own and are given what they need: the connection timing and backoff, the retries of a refused op, the review record and the plans of a revert and a restore, the checkpoint list as the server sent it, the mode picks, the level of an action, the commands of a drop and of a resize on a laid-out canvas, the key table with the rule that turns a key press into what it makes, the command palette (its entries, search, ranking and what running one makes), the canvas's way to its boxes (the host's text measurer, the layout-on-canvas flag and the per-revision caches of the scene), and the PNG export of a frame (the rectangle, scale, size in pixels, file name and refusal, the steps of an export and the delivery of its image, which the shell reports and the app checks against the plan and the limits). Split from meldframe-app for the size ceiling; no AppState, no events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-check = { path = "../meldframe-check" }
meldframe-checkpoints = { path = "../meldframe-checkpoints" }
meldframe-layout = { path = "../meldframe-layout" }
meldframe-order = { path = "../meldframe-order" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-render = { path = "../meldframe-render" }
meldframe-revert = { path = "../meldframe-revert" }
meldframe-sync = { path = "../meldframe-sync" }
meldframe-text = { path = "../meldframe-text" }
meldframe-variables = { path = "../meldframe-variables" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
