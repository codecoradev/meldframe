[package]
name = "meldframe-app-parts"
description = "Pure parts of the app layer: the Variables panel view, the answers of the server checked against its own bounds, the properties of a node, the nodes a command touches, the commands and the wording of a document action, the bind picker, and the binding of a field. Split from meldframe-app to keep it under the size ceiling; no state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-activity = { path = "../meldframe-activity" }
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-check = { path = "../meldframe-check" }
meldframe-checkpoints = { path = "../meldframe-checkpoints" }
meldframe-order = { path = "../meldframe-order" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-render = { path = "../meldframe-render" }
meldframe-sync = { path = "../meldframe-sync" }
meldframe-text = { path = "../meldframe-text" }
meldframe-variables = { path = "../meldframe-variables" }
meldframe-variant = { path = "../meldframe-variant" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
