[package]
name = "meldframe-app-nudge"
description = "What an arrow key does to the selection of a file: the commands of one press, a step of 1 unit or 10 in world space for a node outside a flow and one place along the flow for a child of an auto layout frame, as a pure function of the nodes, the selection, the key and the layout flag. Split from meldframe-app-rules so that neither passes the monolith threshold; no AppState, no events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-app-parts = { path = "../meldframe-app-parts" }
meldframe-app-rules = { path = "../meldframe-app-rules" }
meldframe-layout = { path = "../meldframe-layout" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-sync = { path = "../meldframe-sync" }

[lints]
workspace = true
