[package]
name = "meldframe-snapshot-tests"
description = "Tests of the snapshot route GET /v1/files/{file} and of the last actor of each node against the real server. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-http = { path = "../../integrations/meldframe-http" }
meldframe-http-snapshot = { path = "../../integrations/meldframe-http-snapshot" }
meldframe-server = { path = "../../../apps/server" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
