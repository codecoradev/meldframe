[package]
name = "meldframe-app-pointer"
description = "The pointer state machine of the canvas: what a press, a drag, a release, a cancel and a hover come to, as a pure function of its own mode and of what the app tells it (the one hit rule, the selection, the camera). It answers with the actions the file already has and the hover, cursor and gesture a front end draws. Split from meldframe-app-rules so that neither passes the monolith threshold; no AppState, no events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-app-rules = { path = "../meldframe-app-rules" }
meldframe-layout = { path = "../meldframe-layout" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
