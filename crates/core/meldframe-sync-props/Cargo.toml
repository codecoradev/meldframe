[package]
name = "meldframe-sync-props"
description = "Property tests for meldframe-sync: random runs of several replicas against an in-memory server and against the real gate and room of meldframe-host. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-core = { path = "../meldframe-core" }
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-order = { path = "../meldframe-order" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-sync = { path = "../meldframe-sync" }
serde_json = "1"

# See meldframe-order/Cargo.toml: the tests run under WASM through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
