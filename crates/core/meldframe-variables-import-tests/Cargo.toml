[package]
name = "meldframe-variables-import-tests"
description = "The tests of the variables import (E3.4): colours and values, the scanner, the commands and report it makes, a representative theme, and hostile text. Split from the crate so that it stays under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
variables-import = { path = "../../features/variables-import/variables-import" }
meldframe-core = { path = "../meldframe-core" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-variables = { path = "../meldframe-variables" }

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
