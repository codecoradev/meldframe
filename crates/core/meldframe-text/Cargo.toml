[package]
name = "meldframe-text"
description = "Text that comes from a model, a server or a file, made safe to display and capped (U9): the one set of hidden characters, two profiles (strict for identifiers, display for a node name), the caps and one error type. Portable; no dependency of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dev-dependencies]
# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
