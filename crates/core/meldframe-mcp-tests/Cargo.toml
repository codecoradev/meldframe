[package]
name = "meldframe-mcp-tests"
description = "Tests of the MCP surface against the real server, with the rmcp client over HTTP. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dependencies]
activity-store = { path = "../../features/activity/activity-store" }
meldframe-activity = { path = "../meldframe-activity" }
meldframe-host = { path = "../meldframe-host" }
meldframe-calls = { path = "../meldframe-calls" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-render = { path = "../meldframe-render" }
meldframe-http = { path = "../../integrations/meldframe-http", features = ["mcp"] }
meldframe-http-activity = { path = "../../integrations/meldframe-http-activity" }
meldframe-http-capture = { path = "../../integrations/meldframe-http-capture" }
meldframe-http-export = { path = "../../integrations/meldframe-http-export" }
meldframe-http-html-import = { path = "../../integrations/meldframe-http-html-import" }
meldframe-http-assets = { path = "../../integrations/meldframe-http-assets" }
meldframe-server = { path = "../../../apps/server" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
