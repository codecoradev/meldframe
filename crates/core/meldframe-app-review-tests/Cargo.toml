[package]
name = "meldframe-app-review-tests"
description = "The review and checkpoint tests of meldframe-app (E5.2, E5.3): revert a batch, restore a checkpoint, against a loopback server. Split from meldframe-app-unit-tests for the size ceiling; it includes that crate's test harness by path. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-app-rules = { path = "../meldframe-app-rules" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde_json = "1"

# See meldframe-order/Cargo.toml: the tests run under WASM through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
