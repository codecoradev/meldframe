[package]
name = "meldframe-import-html-style-tests"
description = "The tests of the style stage of the HTML import (E4.4): the computed style of every element, its custom properties, var(), inheritance, rem and em, and the budgets of the stage. Split from the CSS tests crate for the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
html-import = { path = "../../features/html-import/html-import" }

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file imports it as `test` on
# wasm32 only. Keep the version in step with `meldframe-import-html-tests`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
