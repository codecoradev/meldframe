[package]
name = "meldframe-app-model"
description = "The plain data of the app layer: Action, Effect, Event and AppState, with their TypeScript types. Split from meldframe-app to keep it under the size ceiling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-protocol = { path = "../meldframe-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[lints]
workspace = true
