[package]
name = "meldframe-history-props"
description = "Property and load-boundary tests for meldframe-history: random runs of undo and redo, and refusal of bad stored files. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-check = { path = "../meldframe-check" }
meldframe-history = { path = "../meldframe-history" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde_json = "1"

# See meldframe-order/Cargo.toml: the tests run under WASM through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
