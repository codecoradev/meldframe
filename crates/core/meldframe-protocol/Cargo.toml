[package]
name = "meldframe-protocol"
description = "Wire and model types shared by server, client and agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
