[package]
name = "meldframe-protocol"
description = "Wire and model types shared by server, client and agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
# Exact floats: a command is read back as it was written (see `apps/server/tests/wire_floats.rs`). Declared here, where the
# wire shapes live, so a host that links this crate does not get the old parser by accident.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
