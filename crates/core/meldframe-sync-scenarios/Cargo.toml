[package]
name = "meldframe-sync-scenarios"
description = "Scenario tests for meldframe-sync: refused ops, and the limits of the correction of a pending undo. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-check = { path = "../meldframe-check" }
meldframe-core = { path = "../meldframe-core" }
meldframe-history = { path = "../meldframe-history" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-sync = { path = "../meldframe-sync" }
serde_json = "1"

# See meldframe-order/Cargo.toml: the tests run under WASM through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
