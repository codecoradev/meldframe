[package]
name = "meldframe-app-unit-tests"
description = "The unit-level tests of meldframe-app: its actions, events, state and wire shapes against a loopback server. Split from the crate so that the app layer stays under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-app-parts = { path = "../meldframe-app-parts" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-render = { path = "../meldframe-render" }
serde_json = "1"

# See meldframe-order/Cargo.toml: the tests run under WASM through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
