[package]
name = "meldframe-app-unit-tests"
description = "The unit-level tests of meldframe-app: its actions, events, state and wire shapes against a loopback server. Split from the crate so that the app layer stays under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-app-model = { path = "../meldframe-app-model" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde_json = "1"

[lints]
workspace = true
