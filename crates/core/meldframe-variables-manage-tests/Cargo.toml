[package]
name = "meldframe-variables-manage-tests"
description = "The manage actions of the Variables panel at the app layer seam: create a collection, a mode or a variable with ids the app mints, remove them with or without detaching what uses them, and the refusals. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-app = { path = "../../app/meldframe-app" }
meldframe-app-parts = { path = "../meldframe-app-parts" }
meldframe-app-rules = { path = "../meldframe-app-rules" }
meldframe-check = { path = "../meldframe-check" }
meldframe-core = { path = "../meldframe-core" }
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-variables = { path = "../meldframe-variables" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
