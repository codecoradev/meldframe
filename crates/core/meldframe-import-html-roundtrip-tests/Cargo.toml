[package]
name = "meldframe-import-html-roundtrip-tests"
description = "The round trip of the HTML import (E4.4): frames exported in the css and Tailwind forms, read back by the importer, over seeded random frames. Its own crate because it depends on the export and to keep the other tests crates under the size ceiling. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
export = { path = "../../features/export/export" }
html-import = { path = "../../features/html-import/html-import" }
meldframe-layout = { path = "../meldframe-layout" }
meldframe-protocol = { path = "../meldframe-protocol" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file imports it as `test` on
# wasm32 only. Keep the version in step with `meldframe-import-html-tests`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
