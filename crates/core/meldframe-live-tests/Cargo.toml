[package]
name = "meldframe-live-tests"
description = "Tests of the live event streams of the server and of their WebSocket transport: accepted ops reach subscribers, reconnect from a number, resync, heartbeats. No library code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "tool"

[dev-dependencies]
meldframe-host = { path = "../meldframe-host" }
meldframe-module = { path = "../meldframe-module" }
meldframe-protocol = { path = "../meldframe-protocol" }
meldframe-server = { path = "../../../apps/server" }
meldframe-rooms = { path = "../meldframe-rooms" }
meldframe-http = { path = "../../integrations/meldframe-http" }
meldframe-http-live = { path = "../../integrations/meldframe-http-live" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"

[lints]
workspace = true
