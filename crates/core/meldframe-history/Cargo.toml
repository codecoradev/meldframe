[package]
name = "meldframe-history"
description = "FileState: the in-memory tree of one file, with undo and redo per actor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "core"

[dependencies]
meldframe-check = { path = "../meldframe-check" }
meldframe-core = { path = "../meldframe-core" }
meldframe-protocol = { path = "../meldframe-protocol" }

[dev-dependencies]
meldframe-order = { path = "../meldframe-order" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
