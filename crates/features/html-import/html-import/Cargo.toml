[package]
name = "html-import"
description = "HTML import feature module (E4.4): the facade of the importer. It re-exports its stages (the tree builder as `html`, the CSS reader, cascade and computed style as `css`, the Tailwind decoder as `tw`) under their short names and holds the mapping to Commands (`map::import`) and the paint stage. A function of the text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "feature"
group = "html-import"

[lints]
workspace = true

[dependencies]
html-import-css = { path = "../html-import-css" }
html-import-style = { path = "../html-import-style" }
html-import-tree = { path = "../html-import-tree" }
meldframe-layout = { path = "../../../core/meldframe-layout" }
meldframe-module = { path = "../../../core/meldframe-module" }
meldframe-protocol = { path = "../../../core/meldframe-protocol" }
meldframe-text = { path = "../../../core/meldframe-text" }

[dev-dependencies]
export = { path = "../../export/export" }
meldframe-check = { path = "../../../core/meldframe-check" }
serde_json = "1"

# The tests run under WASM through wasm-bindgen-test (`just wasm-test`); each test file
# imports it as `test` on wasm32 only. Keep the version in step with the `wasm-bindgen-cli` that
# provides `wasm-bindgen-test-runner` (0.2.130 pairs with 0.3.80).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
