[package]
name = "meldframe-http-assets"
description = "The asset routes over HTTP (E2.5): POST /v1/assets takes an image, GET /v1/assets/{id} gives it back, both in the workspace of the token."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[dependencies]
assets = { path = "../../features/assets/assets" }
meldframe-http = { path = "../meldframe-http", features = ["mcp"] }
meldframe-host = { path = "../../core/meldframe-host" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
meldframe-module = { path = "../../core/meldframe-module" }
rmcp = { version = "3.10", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[lints]
workspace = true
