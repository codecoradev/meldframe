[package]
name = "meldframe-http-variant"
description = "The make_variant MCP tool (E5.4): a copy of a frame and its subtree beside it, written as one atomic call through the gate of the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[dependencies]
meldframe-check = { path = "../../core/meldframe-check" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-http = { path = "../meldframe-http", features = ["mcp"] }
meldframe-module = { path = "../../core/meldframe-module" }
meldframe-variant = { path = "../../core/meldframe-variant" }
rmcp = { version = "3.10", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
