[package]
name = "meldframe-http-variables-import"
description = "The MCP tool import_tokens (E3.4): reads CSS text, makes the variable commands with the variables-import feature and writes them as one atomic call through the gate of the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `bin`, as the other crates that serve a feature module over HTTP: it depends on the feature crate.
[package.metadata.meldframe]
kind = "bin"

[dependencies]
variables-import = { path = "../../features/variables-import/variables-import" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-http = { path = "../meldframe-http", features = ["mcp"] }
meldframe-module = { path = "../../core/meldframe-module" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
rmcp = { version = "3.10", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
