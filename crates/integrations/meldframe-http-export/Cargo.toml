[package]
name = "meldframe-http-export"
description = "The MCP tool export_frame (E4.1): reads a file through a seam of the server and answers with the HTML, the styles and the report of the export feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `bin`, as the other crates that serve a feature module over HTTP: it depends on the feature crate.
[package.metadata.meldframe]
kind = "bin"

[dependencies]
export = { path = "../../features/export/export" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-http = { path = "../meldframe-http", features = ["mcp"] }
meldframe-layout = { path = "../../core/meldframe-layout" }
meldframe-module = { path = "../../core/meldframe-module" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-render = { path = "../../core/meldframe-render" }
rmcp = { version = "3.10", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
