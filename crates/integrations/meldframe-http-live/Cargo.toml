[package]
name = "meldframe-http-live"
description = "The live WebSocket of the HTTP adapter: GET /v1/live/{file} streams a file's accepted ops, ephemeral frames, heartbeats and the resync marker, with a timer that sends heartbeats and drops silent clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[dependencies]
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-stream = { path = "../../core/meldframe-stream" }
meldframe-http = { path = "../meldframe-http" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[lints]
workspace = true
