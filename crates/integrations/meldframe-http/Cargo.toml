[package]
name = "meldframe-http"
description = "Thin axum adapter: REST and WebSocket submit through one handler, with auth, rate limit, size and time limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[features]
# The MCP surface (E1.5). Off by default so the portable build does not pull a server stack.
mcp = ["dep:rmcp", "dep:meldframe-check", "dep:meldframe-layout", "dep:meldframe-module"]

[dependencies]
meldframe-activity = { path = "../../core/meldframe-activity" }
meldframe-checkpoints = { path = "../../core/meldframe-checkpoints" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-check = { path = "../../core/meldframe-check", optional = true }
meldframe-batch = { path = "../../core/meldframe-batch" }
meldframe-ratelimit = { path = "../../core/meldframe-ratelimit" }
meldframe-layout = { path = "../../core/meldframe-layout", optional = true }
meldframe-module = { path = "../../core/meldframe-module", optional = true }
meldframe-mcp-defs = { path = "../../core/meldframe-mcp-defs" }
meldframe-text = { path = "../../core/meldframe-text" }
rmcp = { version = "3.10", optional = true, default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
# The accept loop of `serve` (a header-read timeout, which `axum::serve` does not expose).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false }

[lints]
workspace = true
