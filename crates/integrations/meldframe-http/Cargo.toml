[package]
name = "meldframe-http"
description = "Thin axum adapter: REST and WebSocket submit through one handler, with auth, rate limit, size and time limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[features]
# The MCP surface (E1.5). Off by default so the portable build does not pull a server stack.
mcp = ["dep:rmcp", "dep:meldframe-check", "dep:meldframe-layout", "dep:meldframe-module"]
# The export_frame tool (E4.1): the `export` module. It is an MCP tool, so it needs `mcp`.
export = ["mcp", "dep:export", "dep:meldframe-render"]
# The design_review tool (E5.4): the `review` module.
review = ["mcp", "dep:design-review"]
# The import_tokens tool (E3.4): the `variables_import` module.
variables-import = ["mcp", "dep:variables-import"]
# The make_variant tool (E5.4): the `variant` module.
variant = ["mcp", "dep:meldframe-variant"]
# The asset routes and the upload_asset tool (E2.5): the `assets` module. It is an MCP tool, so it needs `mcp`.
assets = ["mcp", "dep:assets", "dep:base64", "dep:futures-util"]
# The import_html tool (E4.4): the `html_import` module. It is an MCP tool, so it needs `mcp`.
html-import = ["mcp", "dep:html-import", "dep:meldframe-core", "dep:meldframe-variant", "dep:meldframe-layout", "dep:meldframe-check"]

[dependencies]
meldframe-activity = { path = "../../core/meldframe-activity" }
meldframe-checkpoints = { path = "../../core/meldframe-checkpoints" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-check = { path = "../../core/meldframe-check", optional = true }
meldframe-batch = { path = "../../core/meldframe-batch" }
meldframe-ratelimit = { path = "../../core/meldframe-ratelimit" }
meldframe-stream = { path = "../../core/meldframe-stream" }
meldframe-layout = { path = "../../core/meldframe-layout", optional = true }
meldframe-core = { path = "../../core/meldframe-core", optional = true }
meldframe-render = { path = "../../core/meldframe-render", optional = true }
meldframe-variant = { path = "../../core/meldframe-variant", optional = true }
export = { path = "../../features/export/export", optional = true }
design-review = { path = "../../features/design-review/design-review", optional = true }
variables-import = { path = "../../features/variables-import/variables-import", optional = true }
assets = { path = "../../features/assets/assets", optional = true }
html-import = { path = "../../features/html-import/html-import", optional = true }
meldframe-module = { path = "../../core/meldframe-module", optional = true }
meldframe-mcp-defs = { path = "../../core/meldframe-mcp-defs" }
meldframe-text = { path = "../../core/meldframe-text" }
rmcp = { version = "3.10", optional = true, default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# The accept loop of `serve` (a header-read timeout, which `axum::serve` does not expose).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", default-features = false }

[lints]
workspace = true
