[package]
name = "meldframe-http-capture"
description = "The capture relay over HTTP: the MCP capture tool, the hook on the live sockets that registers capable editors and takes their refusals, and POST /captures/{requestId} for the image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[dependencies]
capture = { path = "../../features/capture/capture" }
meldframe-module = { path = "../../core/meldframe-module" }
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-stream = { path = "../../core/meldframe-stream" }
meldframe-text = { path = "../../core/meldframe-text" }
meldframe-http = { path = "../meldframe-http", features = ["mcp"] }
meldframe-http-live = { path = "../meldframe-http-live" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "3.10", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
getrandom = "0.3"

[lints]
workspace = true
