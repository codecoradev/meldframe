[package]
name = "meldframe-store-pg"
description = "The Postgres adapter of the store seam (E1.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "bin"

[dependencies]
meldframe-host = { path = "../../core/meldframe-host" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-calls = { path = "../../core/meldframe-calls" }
meldframe-module = { path = "../../core/meldframe-module" }
design-review = { path = "../../features/design-review/design-review" }
# No TLS feature: a deployment that needs it turns it on deliberately.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "migrate", "macros"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
