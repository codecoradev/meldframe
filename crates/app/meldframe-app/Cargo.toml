[package]
name = "meldframe-app"
description = "UI-neutral state, actions, effects and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "app"

[dependencies]
meldframe-activity = { path = "../../core/meldframe-activity" }
export-dialog = { path = "../../features/export/export-dialog" }
variables-import-dialog = { path = "../../features/variables-import/variables-import-dialog" }
meldframe-check = { path = "../../core/meldframe-check" }
meldframe-checkpoints = { path = "../../core/meldframe-checkpoints" }
meldframe-layout = { path = "../../core/meldframe-layout" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-render = { path = "../../core/meldframe-render" }
meldframe-revert = { path = "../../core/meldframe-revert" }
meldframe-history = { path = "../../core/meldframe-history" }
meldframe-sync = { path = "../../core/meldframe-sync" }
meldframe-text = { path = "../../core/meldframe-text" }
meldframe-app-parts = { path = "../../core/meldframe-app-parts" }
meldframe-app-rules = { path = "../../core/meldframe-app-rules" }
meldframe-app-model = { path = "../../core/meldframe-app-model" }
meldframe-variables = { path = "../../core/meldframe-variables" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
