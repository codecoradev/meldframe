[package]
name = "meldframe-app"
description = "UI-neutral state, actions, effects and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "app"

[dependencies]
meldframe-variant = { path = "../../core/meldframe-variant" }
meldframe-check = { path = "../../core/meldframe-check" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-render = { path = "../../core/meldframe-render" }
meldframe-revert = { path = "../../core/meldframe-revert" }
meldframe-history = { path = "../../core/meldframe-history" }
meldframe-sync = { path = "../../core/meldframe-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[lints]
workspace = true
