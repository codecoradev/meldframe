[package]
name = "meldframe-wasm"
description = "Thin wasm-bindgen glue over core and the app layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "ffi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meldframe-app = { path = "../meldframe-app" }
meldframe-layout = { path = "../../core/meldframe-layout" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
meldframe-text = { path = "../../core/meldframe-text" }
js-sys = "0.3.107"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2.130"

[lints]
workspace = true
