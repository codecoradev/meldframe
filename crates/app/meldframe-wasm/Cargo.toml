[package]
name = "meldframe-wasm"
description = "Thin wasm-bindgen glue over core and the app layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.meldframe]
kind = "app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meldframe-app = { path = "../meldframe-app" }
meldframe-protocol = { path = "../../core/meldframe-protocol" }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2.130"

[lints]
workspace = true
