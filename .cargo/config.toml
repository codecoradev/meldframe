[alias]
xtask = "run --quiet --package xtask --"

# `cargo test --target wasm32-unknown-unknown` hands each test binary to this runner, which runs it
# in Node (`just wasm-test`). It is only used for that target; install it as AGENTS.md says.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# TypeScript types generated by ts-rs are written here by `cargo test -p meldframe-protocol`.
[env]
TS_RS_EXPORT_DIR = { value = "packages/protocol/src/generated", relative = true }
