# CI for pull requests (docs/epics.md E0.2, docs/standards/modular-thin-ui.md section 5).
#
# This is the FAST set that every pull request must pass, in two jobs so that a runner with little
# capacity is not flooded: `checks` (scripts self-test, format, lint, tests, deps-check, protocol
# drift check, run one after another on one toolchain and one cache) and `migrations` (needs a
# Postgres service). The heavier gates (build-matrix, portable-check, size-check, ui-literals,
# licences) run nightly in .gitea/workflows/nightly.yml, and locally with `just check` before a
# pull request is opened.
#
# Runs on pull requests only: a branch is checked once, through its pull request, and a newer push
# to the same pull request cancels the run in progress. `develop` receives changes only through a
# pull request that already ran this workflow.
#
# PENDING GATES. Some commands do not exist yet (the Cargo workspace is T0.1, #37; `deps-check` is
# T0.2, #38; the other xtask commands are T0.3, #39). A gate listed in `.gitea/ci-pending.txt`
# reports success without running and prints a notice, so the check name exists for branch
# protection and no check is red for a missing command. The pull request that adds a command
# removes its line from that file; from then on the gate runs for real. A gate that is not listed
# is never skipped.
#
# Contexts to require in branch protection: `ci / checks (pull_request)`, `ci / migrations (pull_request)`
# and the context of pr-checks.yml. The Cora review in CI is disabled.
name: ci

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scripts (good and bad examples for the branch, message and description checks)
        run: sh scripts/ci/selftest.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Layering (kinds, groups, UI toolkit usage)
        run: cargo xtask deps-check
      - name: Protocol drift (generated TypeScript matches the committed files)
        run: bash tools/check-protocol.sh

  # Migrations apply from an empty database and keep the schema_version rules (tools/check-migrations.sh).
  # The service alias is unique on purpose: a generic alias can collide with other containers on the
  # runner's shared job network (see the same note in gatehouse). No `ports:` publish.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      meldframe-pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@meldframe-pg:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: install the PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - run: bash tools/check-migrations.sh
      # The Postgres adapter of the Store seam runs the shared store contract and the restart tests here;
      # without DATABASE_URL they skip, so the `checks` job (no database) stays green.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Store contract and restart tests against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@meldframe-pg:5432/postgres
          # A missing DATABASE_URL fails the tests here instead of skipping them.
          MELDFRAME_REQUIRE_PG: "1"
        run: cargo test -p meldframe-server-tests --test pg_contract --test pg_restore --test pg_isolation
