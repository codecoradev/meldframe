# CI for pull requests (docs/epics.md E0.2, docs/standards/modular-thin-ui.md section 5).
#
# This is the FAST set that every pull request must pass: scripts self-test, format, lint, tests,
# deps-check, the protocol drift check and the migrations check. The heavier gates (build-matrix,
# portable-check, size-check, ui-literals, licences) run on every push to `develop` and nightly in
# .gitea/workflows/nightly.yml, and locally with `just check` before a pull request is opened.
#
# Runs on pull requests only: a branch is checked once, through its pull request, and a newer push
# to the same pull request cancels the run in progress. `develop` receives changes only through a
# pull request that already ran this workflow.
#
# PENDING GATES. Some commands do not exist yet (the Cargo workspace is T0.1, #37; `deps-check` is
# T0.2, #38; the other xtask commands are T0.3, #39). A gate listed in `.gitea/ci-pending.txt`
# reports success without running and prints a notice, so the check name exists for branch
# protection and no check is red for a missing command. The pull request that adds a command
# removes its line from that file; from then on the gate runs for real. A gate that is not listed
# is never skipped.
#
# Required contexts (branch protection, set by the owner): every job `name` below, shown by Gitea
# as `ci / <name> (pull_request)`, plus the contexts of pr-checks.yml and cora-review.yml.
name: ci

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The check scripts themselves: good and bad examples for the branch, message and description
  # checks and for the pending list. Needs nothing but a shell.
  ci-scripts:
    name: ci scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci/selftest.sh

  fmt:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh fmt
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo fmt --all --check

  clippy:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh clippy
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh test
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo test --workspace

  deps-check:
    name: deps-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh deps-check
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask deps-check

  # Generated TypeScript types must match the committed ones and type-check (tools/check-protocol.sh).
  protocol:
    name: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash tools/check-protocol.sh

  # Migrations apply from an empty database and keep the schema_version rules (tools/check-migrations.sh).
  # The service alias is unique on purpose: a generic alias can collide with other containers on the
  # runner's shared job network (see the same note in gatehouse). No `ports:` publish.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      meldframe-pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@meldframe-pg:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: install the PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - run: bash tools/check-migrations.sh

