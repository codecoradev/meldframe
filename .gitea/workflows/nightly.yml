# The heavier gates, kept off the pull request path so reviews stay quick (docs/epics.md E0.2).
# Run them locally before opening a pull request: `just check`. They run here
# nightly and on demand, so a gap in local checking is caught within a day. They no longer run on
# every push to `develop`: with several pull requests merging per hour that flooded the runner.
# A gate whose command is not merged yet is listed in `.gitea/ci-pending.txt` and passes without
# running (scripts/ci/gate.sh).
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh build-matrix
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask build-matrix

  portable-check:
    name: portable-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh portable-check
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask portable-check

  size-check:
    name: size-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh size-check
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask size-check

  ui-literals:
    name: ui-literals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh ui-literals
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask ui-literals

  licences:
    name: licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: sh scripts/ci/gate.sh licences
      - if: steps.gate.outputs.pending != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.pending != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.gate.outputs.pending != 'true'
        run: cargo xtask licences --check

  # More seeds than a pull request run (600, the default of `cargo test --workspace`), and the E1.1
  # mutation check: each rule switched off must make a test fail (tools/mutation-check-sync.sh).
  property-tests:
    name: property-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: more seeds
        run: MELDFRAME_SEEDS=6000 cargo test --release -p meldframe-history -p meldframe-sync-props
      # Runs even if the seeds step failed, so one failure does not hide the other.
      - name: mutation check
        if: always()
        run: bash tools/mutation-check-sync.sh
